version: '3.8'

services:
  web:
    build: .
    container_name: petcare_web
    restart: always
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=development
      - DATABASE_URL=mysql+pymysql://petcare_user:petcare_pass@db:3306/vet_center?charset=utf8mb4
      - SECRET_KEY=petcare_docker_compose_secret_2026
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/app
      - /app/venv

  db:
    image: mysql:8.0
    container_name: petcare_db
    restart: always
    environment:
      MYSQL_DATABASE: vet_center
      MYSQL_USER: petcare_user
      MYSQL_PASSWORD: petcare_pass
      MYSQL_ROOT_PASSWORD: root_password_2026
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02_seed.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mysql_data:
